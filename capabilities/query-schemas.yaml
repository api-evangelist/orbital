naftiko: 1.0.0-alpha2
info:
  label: Orbital Query API — Schemas
  description: 'Orbital Query API — Schemas. 1 operations. Lead operation: Orbital List schemas. Self-contained Naftiko capability
    covering one Orbital business surface.'
  tags:
  - Orbital
  - Schemas
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORBITAL_API_KEY: ORBITAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: query-schemas
    baseUri: https://localhost:9022
    description: Orbital Query API — Schemas business capability. Self-contained, no shared references.
    resources:
    - name: api-schemas
      path: /api/schemas
      operations:
      - name: listschemas
        method: GET
        description: Orbital List schemas
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: query-schemas-rest
    port: 8080
    description: REST adapter for Orbital Query API — Schemas. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/schemas
      name: api-schemas
      description: REST surface for api-schemas.
      operations:
      - method: GET
        name: listschemas
        description: Orbital List schemas
        call: query-schemas.listschemas
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: query-schemas-mcp
    port: 9090
    transport: http
    description: MCP adapter for Orbital Query API — Schemas. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: orbital-list-schemas
      description: Orbital List schemas
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: query-schemas.listschemas
      outputParameters:
      - type: object
        mapping: $.

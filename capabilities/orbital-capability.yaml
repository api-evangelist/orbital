naftiko: 1.0.0-alpha2
info:
  label: Orbital Query API
  description: The Orbital Query API allows developers to submit TaxiQL queries to the Orbital data gateway for integrating,
    transforming, and discovering data across APIs, databases, event streams, and other data sources. Queries are written
    in TaxiQL, a technology-agnostic query language, and submitted to the /api/taxiql endpoint. Results can be returned as
    a single JSON batch or streamed via Server-Sent Events. Orbital automatically orchestrates the required data fetching
    across connected services based on semantic type metadata in your API specs.
  tags:
  - Orbital
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: orbital
    baseUri: https://localhost:9022
    description: Orbital Query API HTTP API.
    resources:
    - name: api-taxiql
      path: /api/taxiql
      operations:
      - name: submittaxiqlquery
        method: POST
        description: Orbital Submit a TaxiQL query
        inputParameters:
        - name: resultMode
          in: query
          type: string
          description: Controls how type metadata is included in the response. Set to TYPED to include type metadata with
            results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-schemas
      path: /api/schemas
      operations:
      - name: listschemas
        method: GET
        description: Orbital List schemas
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-services
      path: /api/services
      operations:
      - name: listservices
        method: GET
        description: Orbital List connected services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-connections
      path: /api/connections
      operations:
      - name: listconnections
        method: GET
        description: Orbital List data source connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createconnection
        method: POST
        description: Orbital Create a data source connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-connections-connectionid
      path: /api/connections/{connectionId}
      operations:
      - name: getconnection
        method: GET
        description: Orbital Get a data source connection
        inputParameters:
        - name: connectionId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteconnection
        method: DELETE
        description: Orbital Delete a data source connection
        inputParameters:
        - name: connectionId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-types
      path: /api/types
      operations:
      - name: listtypes
        method: GET
        description: Orbital List registered types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-caches
      path: /api/caches
      operations:
      - name: listcaches
        method: GET
        description: Orbital List cache configurations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: orbital-rest
    description: REST adapter for Orbital Query API.
    resources:
    - path: /api/taxiql
      name: submittaxiqlquery
      operations:
      - method: POST
        name: submittaxiqlquery
        description: Orbital Submit a TaxiQL query
        call: orbital.submittaxiqlquery
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/schemas
      name: listschemas
      operations:
      - method: GET
        name: listschemas
        description: Orbital List schemas
        call: orbital.listschemas
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/services
      name: listservices
      operations:
      - method: GET
        name: listservices
        description: Orbital List connected services
        call: orbital.listservices
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/connections
      name: listconnections
      operations:
      - method: GET
        name: listconnections
        description: Orbital List data source connections
        call: orbital.listconnections
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/connections
      name: createconnection
      operations:
      - method: POST
        name: createconnection
        description: Orbital Create a data source connection
        call: orbital.createconnection
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/connections/{connectionId}
      name: getconnection
      operations:
      - method: GET
        name: getconnection
        description: Orbital Get a data source connection
        call: orbital.getconnection
        with:
          connectionId: rest.connectionId
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/connections/{connectionId}
      name: deleteconnection
      operations:
      - method: DELETE
        name: deleteconnection
        description: Orbital Delete a data source connection
        call: orbital.deleteconnection
        with:
          connectionId: rest.connectionId
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/types
      name: listtypes
      operations:
      - method: GET
        name: listtypes
        description: Orbital List registered types
        call: orbital.listtypes
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/caches
      name: listcaches
      operations:
      - method: GET
        name: listcaches
        description: Orbital List cache configurations
        call: orbital.listcaches
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: orbital-mcp
    transport: http
    description: MCP adapter for Orbital Query API for AI agent use.
    tools:
    - name: submittaxiqlquery
      description: Orbital Submit a TaxiQL query
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: orbital.submittaxiqlquery
      with:
        resultMode: tools.resultMode
      inputParameters:
      - name: resultMode
        type: string
        description: Controls how type metadata is included in the response. Set to TYPED to include type metadata with results.
      outputParameters:
      - type: object
        mapping: $.
    - name: listschemas
      description: Orbital List schemas
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: orbital.listschemas
      outputParameters:
      - type: object
        mapping: $.
    - name: listservices
      description: Orbital List connected services
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: orbital.listservices
      outputParameters:
      - type: object
        mapping: $.
    - name: listconnections
      description: Orbital List data source connections
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: orbital.listconnections
      outputParameters:
      - type: object
        mapping: $.
    - name: createconnection
      description: Orbital Create a data source connection
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: orbital.createconnection
      outputParameters:
      - type: object
        mapping: $.
    - name: getconnection
      description: Orbital Get a data source connection
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: orbital.getconnection
      with:
        connectionId: tools.connectionId
      inputParameters:
      - name: connectionId
        type: string
        description: connectionId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: deleteconnection
      description: Orbital Delete a data source connection
      hints:
        readOnly: false

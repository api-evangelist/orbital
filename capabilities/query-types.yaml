naftiko: 1.0.0-alpha2
info:
  label: Orbital Query API — Types
  description: 'Orbital Query API — Types. 1 operations. Lead operation: Orbital List registered types. Self-contained Naftiko
    capability covering one Orbital business surface.'
  tags:
  - Orbital
  - Types
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORBITAL_API_KEY: ORBITAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: query-types
    baseUri: https://localhost:9022
    description: Orbital Query API — Types business capability. Self-contained, no shared references.
    resources:
    - name: api-types
      path: /api/types
      operations:
      - name: listtypes
        method: GET
        description: Orbital List registered types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: query-types-rest
    port: 8080
    description: REST adapter for Orbital Query API — Types. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/types
      name: api-types
      description: REST surface for api-types.
      operations:
      - method: GET
        name: listtypes
        description: Orbital List registered types
        call: query-types.listtypes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: query-types-mcp
    port: 9090
    transport: http
    description: MCP adapter for Orbital Query API — Types. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: orbital-list-registered-types
      description: Orbital List registered types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: query-types.listtypes
      outputParameters:
      - type: object
        mapping: $.

naftiko: 1.0.0-alpha2
info:
  label: Orbital Query API — Services
  description: 'Orbital Query API — Services. 1 operations. Lead operation: Orbital List connected services. Self-contained
    Naftiko capability covering one Orbital business surface.'
  tags:
  - Orbital
  - Services
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORBITAL_API_KEY: ORBITAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: query-services
    baseUri: https://localhost:9022
    description: Orbital Query API — Services business capability. Self-contained, no shared references.
    resources:
    - name: api-services
      path: /api/services
      operations:
      - name: listservices
        method: GET
        description: Orbital List connected services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: query-services-rest
    port: 8080
    description: REST adapter for Orbital Query API — Services. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/services
      name: api-services
      description: REST surface for api-services.
      operations:
      - method: GET
        name: listservices
        description: Orbital List connected services
        call: query-services.listservices
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: query-services-mcp
    port: 9090
    transport: http
    description: MCP adapter for Orbital Query API — Services. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: orbital-list-connected-services
      description: Orbital List connected services
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: query-services.listservices
      outputParameters:
      - type: object
        mapping: $.

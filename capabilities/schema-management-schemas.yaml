naftiko: 1.0.0-alpha2
info:
  label: Orbital Schema Management API — Schemas
  description: 'Orbital Schema Management API — Schemas. 5 operations. Lead operation: Orbital List schemas. Self-contained
    Naftiko capability covering one Orbital business surface.'
  tags:
  - Orbital
  - Schemas
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORBITAL_API_KEY: ORBITAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: schema-management-schemas
    baseUri: https://localhost:9022
    description: Orbital Schema Management API — Schemas business capability. Self-contained, no shared references.
    resources:
    - name: api-schemas
      path: /api/schemas
      operations:
      - name: listschemas
        method: GET
        description: Orbital List schemas
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createschema
        method: POST
        description: Orbital Register a new schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-schemas-schemaId
      path: /api/schemas/{schemaId}
      operations:
      - name: getschema
        method: GET
        description: Orbital Get a schema by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: schemaId
          in: path
          type: string
          required: true
      - name: updateschema
        method: PUT
        description: Orbital Update a schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: schemaId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteschema
        method: DELETE
        description: Orbital Delete a schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: schemaId
          in: path
          type: string
          required: true
  exposes:
  - type: rest
    namespace: schema-management-schemas-rest
    port: 8080
    description: REST adapter for Orbital Schema Management API — Schemas. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/schemas
      name: api-schemas
      description: REST surface for api-schemas.
      operations:
      - method: GET
        name: listschemas
        description: Orbital List schemas
        call: schema-management-schemas.listschemas
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createschema
        description: Orbital Register a new schema
        call: schema-management-schemas.createschema
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/schemas/{schemaid}
      name: api-schemas-schemaid
      description: REST surface for api-schemas-schemaId.
      operations:
      - method: GET
        name: getschema
        description: Orbital Get a schema by ID
        call: schema-management-schemas.getschema
        with:
          schemaId: rest.schemaId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateschema
        description: Orbital Update a schema
        call: schema-management-schemas.updateschema
        with:
          schemaId: rest.schemaId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteschema
        description: Orbital Delete a schema
        call: schema-management-schemas.deleteschema
        with:
          schemaId: rest.schemaId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: schema-management-schemas-mcp
    port: 9090
    transport: http
    description: MCP adapter for Orbital Schema Management API — Schemas. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: orbital-list-schemas
      description: Orbital List schemas
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: schema-management-schemas.listschemas
      outputParameters:
      - type: object
        mapping: $.
    - name: orbital-register-new-schema
      description: Orbital Register a new schema
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: schema-management-schemas.createschema
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: orbital-get-schema-id
      description: Orbital Get a schema by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: schema-management-schemas.getschema
      with:
        schemaId: tools.schemaId
      outputParameters:
      - type: object
        mapping: $.
    - name: orbital-update-schema
      description: Orbital Update a schema
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: schema-management-schemas.updateschema
      with:
        schemaId: tools.schemaId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: orbital-delete-schema
      description: Orbital Delete a schema
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: schema-management-schemas.deleteschema
      with:
        schemaId: tools.schemaId
      outputParameters:
      - type: object
        mapping: $.
